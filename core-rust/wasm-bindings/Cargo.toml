[package]
name = "wasm-bindings"
version = "0.1.0"
edition = "2021"
authors = ["Kundai Farai Sachikonye <kundai.sachikonye@wzw.tum.de>"]
description = "WebAssembly bindings for S-Entropy Framework browser integration"
license = "MIT"
repository = "https://github.com/fullscreen-triangle/space-computer"
keywords = ["wasm", "s-entropy", "webassembly", "browser", "zero-computation"]
categories = ["wasm", "web-programming", "algorithms"]

[lib]
crate-type = ["cdylib"]

[dependencies]
s-entropy-engine = { path = "../s-entropy-engine" }
hardware-integration = { path = "../hardware-integration" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "console",
  "Performance",
  "Window",
  "Navigator",
  "Geolocation",
  "MediaDevices",
  "UserMedia",
  "MediaStream",
  "VideoTrack",
  "AudioTrack",
  "WebGlRenderingContext",
] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
chrono = { workspace = true, features = ["wasmbind"] }
uuid = { workspace = true, features = ["v4", "js"] }
nalgebra = { workspace = true }

# WASM-specific dependencies
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wee_alloc = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "WebGlRenderingContext",
  "WebGl2RenderingContext",
  "Navigator",
  "Geolocation",
  "Position",
  "Coordinates",
  "MediaDevices",
  "MediaStream",
  "VideoTrack",
  "AudioTrack",
]

[features]
default = ["console_error_panic_hook"]

# Optimize for size in release mode
[profile.release]
opt-level = 's'
lto = true
debug = false
panic = "abort"